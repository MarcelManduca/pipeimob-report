name: Gralha baseline candidate — Supabase CLI filename

on:
  push:
    branches: [chore/migration-history-reconciliation-20260903]
    paths:
      - .github/workflows/gralha-baseline-migration-name.yml

permissions:
  contents: read

jobs:
  generate-migration-filename:
    if: github.repository == 'MarcelManduca/pipeimob-report'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Generate an empty migration with the Supabase CLI
        run: |
          before="$(find supabase/migrations -maxdepth 1 -type f -name '*_establish_sanitized_schema_baseline.sql' -print | wc -l)"
          test "$before" -eq 0
          npx --yes supabase@2.20.3 migration new establish_sanitized_schema_baseline
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_establish_sanitized_schema_baseline.sql' -print)"
          test -n "$generated"
          test "$(wc -l < "$generated")" -eq 0
          printf 'CLI_GENERATED_MIGRATION=%s\n' "$(basename "$generated")"
